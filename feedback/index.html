<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Preload Feedback · Rodin</title>
<link rel="icon" href="../img/icon.png">
<link rel="apple-touch-icon" href="../img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#000; --panel:#0B0B0C; --ink:#FFF; --soft:#D6D6D8; --muted:#94949A; --faint:#55555B;
  --line:#1E1E21; --line2:#34343A; --ok:#3CCB7F; --warn:#FFB23F; --bad:#FF5A4E;
  --display:"Michroma","Eurostile","Arial Black",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-transform:uppercase;letter-spacing:.04em;text-wrap:balance}
h1{font-size:1.1rem}h2{font-size:.85rem;line-height:1.5}
.eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

header.top{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:12px;padding-bottom:12px;background:none;border:0;width:100%}
.brand img{height:16px;width:auto;display:block}.brand img.rodin{height:21px}
.brand .x{font-family:var(--mono);color:var(--faint);font-size:.75rem}
button.brand{cursor:pointer}

main{padding-top:22px;padding-bottom:40px;display:grid;gap:16px}
footer{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:.6rem;color:var(--faint);letter-spacing:.08em}

.intro{display:grid;gap:8px}
.intro p{margin:0;color:var(--soft)}

.q{border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:16px;display:grid;gap:10px;min-width:0}
.q label,.q .lbl{display:grid;gap:4px}
.q .n{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;color:var(--muted)}
select,textarea,input[type=text],input[type=password]{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:12px;font-size:16px;width:100%;min-width:0}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{resize:vertical;min-height:84px;line-height:1.45}
select:focus,textarea:focus,input:focus{border-color:var(--ink);outline:none}
.q.need{border-color:var(--bad)}
.hint{font-size:.8rem;color:var(--muted)}
.hint.err{color:var(--bad)}

.rate{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.rate button{aspect-ratio:1;max-width:100%;border:1px solid var(--line2);background:var(--bg);border-radius:999px;font-family:var(--mono);font-weight:600;font-size:.9rem;color:var(--soft);padding:0}
.rate button[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.rate-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
@media (max-width:400px){.rate{grid-template-columns:repeat(5,minmax(0,1fr))}.rate button{aspect-ratio:auto;padding:11px 0}}

.btn{background:transparent;border:1px solid var(--line2);border-radius:999px;padding:10px 16px;font-size:.9rem;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#000;border-color:var(--ink)}
.btn.big{padding:16px 18px;font-size:1rem;width:100%}
.btn:disabled{opacity:.45;cursor:default}

.done{border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:28px 18px;display:grid;gap:12px;text-align:center;justify-items:center}
.done .tick{width:44px;height:44px;border-radius:999px;border:2px solid var(--ok);display:grid;place-items:center;color:var(--ok);font-size:1.3rem}
.done p{margin:0;color:var(--soft)}

/* results */
.login{max-width:380px;width:100%;margin:6vh auto 0;display:grid;gap:10px;border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:18px}
.login label{display:grid;gap:5px;font-size:.82rem;color:var(--soft)}
.sum{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.sum b{font-family:var(--display);font-weight:400;font-size:1.4rem}
.sum span{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools select{width:auto;flex:1 1 200px}
.resp{border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:16px;display:grid;gap:12px;min-width:0}
.resp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.resp-h b{font-weight:700}
.resp-h time{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-left:auto}
.score{font-family:var(--mono);font-weight:600;font-size:.8rem;border:1px solid var(--line2);border-radius:999px;padding:3px 10px}
.score.lo{color:var(--bad);border-color:var(--bad)}.score.mid{color:var(--warn);border-color:var(--warn)}
.resp dl{margin:0;display:grid;gap:10px}
.resp dt{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.resp dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.resp dd.none{color:var(--faint)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:20px;color:var(--soft);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:#000;border-radius:999px;padding:10px 16px;font-size:.88rem;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.done{animation:in .35s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="brandSlot"></div></header>
<main class="wrap" id="main"></main>
<footer class="wrap">VCASO PERFORMANCE × RODIN MOTORSPORT · PRELOAD FEEDBACK 2026</footer>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script>
const SURVEY = "preload-2026";
const DRIVERS = ["Abbi Pulling","Alessandro Giusti","Alex Dunne","Alex Ninovic","Alfie Slater","Brando Badoer","Cameron Campbell","Christian Ho","Dries Van Langendonck","Ella Lloyd","Ella Stevens","Emma Felbermayr","Ethan Lennon","Gabriel Gomez","Josh Buchan","Martin Molnar","Martinius Stenshorne","Maxim Rehm","Pedro Clerot","Reza Seewooruthun"];
const QS = [
  ["good","What part of Preload finds you lap time?"],
  ["bad","What annoys you most about it?"],
  ["letdown","Has it ever let you down? What happened?"],
  ["change","One thing you'd change or add?"]
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get(k){ try{ return localStorage.getItem(k) }catch(_){ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(_){} }, del(k){ try{ localStorage.removeItem(k) }catch(_){} } };
let sb = null;
try { sb = supabase.createClient(window.RH_CONFIG.url, window.RH_CONFIG.key, {auth:{persistSession:true,autoRefreshToken:true}}); } catch(_) {}
let toastT; function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2800); }

function brand(home){
  const inner = `<img src="../img/vcaso.png" alt="VCASO Performance"><span class="x">×</span><img class="rodin" src="../img/rodin.png" alt="Rodin Motorsport">`;
  $("#brandSlot").innerHTML = home ? `<div class="brand">${inner}</div>` : `<button class="brand" type="button" aria-label="Back to the feedback form" onclick="location.hash=''">${inner}</button>`;
}

/* ---------------- driver form ---------------- */
const draft = (() => { try { return JSON.parse(ls.get("pf:draft")||"{}") } catch(_) { return {} } })();
function saveDraft(){ ls.set("pf:draft", JSON.stringify(draft)); }

function formView(){
  brand(true);
  const sent = ls.get("pf:sent");
  if (sent && !draft._again) return doneView(sent);
  $("#main").innerHTML = `
  <div class="intro">
    <span class="eyebrow">Preload app · driver feedback</span>
    <h1>Tell us straight</h1>
    <p>Two minutes, no wrong answers. Good, bad, what to fix. Be as blunt as you like.</p>
  </div>
  <form id="f" novalidate>
    <div style="display:grid;gap:12px">
      <div class="q" id="q-name">
        <label for="driver"><span class="n">DRIVER</span><h2>Your name</h2></label>
        <select id="driver" required>
          <option value="">Select your name</option>
          ${DRIVERS.map(d=>`<option${draft.driver===d?" selected":""}>${esc(d)}</option>`).join("")}
        </select>
      </div>
      ${QS.map(([k,q],i)=>`
      <div class="q">
        <label for="a-${k}"><span class="n">0${i+1}</span><h2>${esc(q)}</h2></label>
        <textarea id="a-${k}" data-k="${k}" maxlength="3000" rows="3">${esc(draft[k]||"")}</textarea>
      </div>`).join("")}
      <div class="q" id="q-rate">
        <div class="lbl"><span class="n">05</span><h2>Rate it out of 10</h2></div>
        <div class="rate" role="group" aria-label="Rating out of 10">
          ${Array.from({length:10},(_,i)=>`<button type="button" data-r="${i+1}" aria-pressed="${draft.rating===i+1}">${i+1}</button>`).join("")}
        </div>
        <div class="rate-ends"><span>Useless</span><span>Perfect</span></div>
      </div>
      <p class="hint err" id="err" hidden></p>
      <button class="btn primary big" type="submit" id="send">Send feedback</button>
    </div>
  </form>`;
}

function doneView(name){
  $("#main").innerHTML = `<div class="done">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Got it${name?", "+esc(name.split(" ")[0]):""}</h1>
    <p>Your feedback is in. Thanks for being straight with us.</p>
    <button class="btn" type="button" id="again">Send another response</button>
  </div>`;
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "driver") { draft.driver = t.value; $("#q-name").classList.remove("need"); saveDraft(); }
  if (t.dataset && t.dataset.k) { draft[t.dataset.k] = t.value; saveDraft(); }
});
document.addEventListener("click", e => {
  const r = e.target.closest("[data-r]");
  if (r) { draft.rating = +r.dataset.r; saveDraft(); document.querySelectorAll("[data-r]").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.r===draft.rating))); $("#q-rate").classList.remove("need"); }
  if (e.target.id === "again") { ls.del("pf:sent"); for (const k of Object.keys(draft)) delete draft[k]; saveDraft(); formView(); scrollTo(0,0); }
  if (e.target.id === "logout") { sb.auth.signOut().then(route); }
});

async function submitForm(){
  const err = $("#err"); err.hidden = true;
  const name = draft.driver || "";
  const answered = QS.some(([k]) => (draft[k]||"").trim()) || draft.rating;
  if (!name) { $("#q-name").classList.add("need"); err.textContent = "Pick your name at the top first."; err.hidden = false; $("#q-name").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  if (!answered) { err.textContent = "Answer at least one question before sending."; err.hidden = false; return; }
  if (!sb) { err.textContent = "The form couldn't connect. Check your signal and try again."; err.hidden = false; return; }
  const btn = $("#send"); btn.disabled = true; btn.textContent = "Sending…";
  const row = { survey: SURVEY, driver_name: name, rating: draft.rating || null };
  QS.forEach(([k]) => row[k] = (draft[k]||"").trim());
  const { error } = await sb.from("rh_feedback").insert(row);
  if (error) {
    btn.disabled = false; btn.textContent = "Send feedback";
    err.textContent = navigator.onLine === false || /fetch|network|load failed/i.test(error.message||"")
      ? "No connection right now. Your answers are saved on this phone, so try again when you have signal."
      : "That didn't go through. Try again, and if it keeps failing message Riki.";
    err.hidden = false; return;
  }
  ls.set("pf:sent", name); ls.del("pf:draft"); for (const k of Object.keys(draft)) delete draft[k];
  doneView(name); scrollTo(0,0);
}

/* ---------------- coach results (#results) ---------------- */
let ROWS = [], FILTER = "";
function loginView(msg){
  brand(false);
  $("#main").innerHTML = `<form class="login" id="lg">
    <h1 style="text-align:center">Responses</h1>
    <p class="hint" style="text-align:center;margin:0">Coach login, same as Rodin Hub.</p>
    <label>Username<input type="text" id="lgU" autocomplete="username" autocapitalize="none"></label>
    <label>Password<input type="password" id="lgP" autocomplete="current-password"></label>
    ${msg?`<p class="hint err" style="margin:0">${esc(msg)}</p>`:""}
    <button class="btn primary big" type="submit">Sign in</button>
  </form>`;
}
async function resultsView(){
  brand(false);
  if (!sb) { $("#main").innerHTML = `<div class="empty">Couldn't connect. Check the connection and reload.</div>`; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return loginView();
  $("#main").innerHTML = `<div class="empty">Loading responses…</div>`;
  const { data, error } = await sb.from("rh_feedback").select("*").eq("survey", SURVEY).order("created_at", {ascending:false});
  if (error) { $("#main").innerHTML = `<div class="empty">Couldn't load responses. Reload to try again.</div>`; return; }
  ROWS = data || [];
  if (!ROWS.length) {
    const { data: me } = await sb.from("rh_profiles").select("role").eq("id", session.user.id).maybeSingle();
    if (!me || me.role !== "coach") { $("#main").innerHTML = `<div class="empty">Only the coach login can see responses. <button class="btn" id="logout" type="button" style="margin-top:12px">Sign out</button></div>`; return; }
  }
  renderResults();
}
function renderResults(){
  const rows = FILTER ? ROWS.filter(r => r.driver_name === FILTER) : ROWS;
  const rated = ROWS.filter(r => r.rating);
  const avg = rated.length ? (rated.reduce((a,r)=>a+r.rating,0)/rated.length).toFixed(1) : "–";
  const who = new Set(ROWS.map(r=>r.driver_name));
  const missing = DRIVERS.filter(d => !who.has(d));
  const fmt = d => new Date(d).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const cls = n => n<=4?"lo":n<=6?"mid":"";
  $("#main").innerHTML = `
  <div class="intro"><span class="eyebrow">Preload feedback 2026</span><h1>Responses</h1></div>
  <div class="sum">
    <div><b>${ROWS.length}</b> <span>responses</span></div>
    <div><b>${who.size}/${DRIVERS.length}</b> <span>drivers</span></div>
    <div><b>${avg}</b> <span>avg rating</span></div>
  </div>
  ${missing.length?`<p class="hint" style="margin:0">Still to reply: ${missing.map(esc).join(", ")}</p>`:""}
  <div class="tools">
    <select id="flt" aria-label="Filter by driver"><option value="">All drivers</option>${[...who].sort().map(d=>`<option${FILTER===d?" selected":""}>${esc(d)}</option>`).join("")}</select>
    <button class="btn" id="csv" type="button">Copy as table</button>
    <button class="btn" id="logout" type="button">Sign out</button>
  </div>
  ${rows.length ? rows.map(r=>`<article class="resp">
    <div class="resp-h"><b>${esc(r.driver_name)}</b>${r.rating?`<span class="score ${cls(r.rating)}">${r.rating}/10</span>`:""}<time>${fmt(r.created_at)}</time></div>
    <dl>${QS.map(([k,q])=>`<div><dt>${esc(q)}</dt><dd class="${r[k]?"":"none"}">${r[k]?esc(r[k]):"No answer"}</dd></div>`).join("")}</dl>
  </article>`).join("") : `<div class="empty">No responses yet. They appear here as soon as a driver sends one.</div>`}`;
}
document.addEventListener("change", e => { if (e.target.id === "flt") { FILTER = e.target.value; renderResults(); } });
document.addEventListener("click", e => {
  if (e.target.id !== "csv") return;
  const cell = s => String(s ?? "").replace(/\t|\r?\n/g," ");
  const head = ["Date","Driver","Rating",...QS.map(q=>q[1])].join("\t");
  const body = ROWS.map(r=>[new Date(r.created_at).toLocaleString("en-GB"),r.driver_name,r.rating??"",...QS.map(([k])=>r[k])].map(cell).join("\t")).join("\n");
  const t = head + "\n" + body;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast("Copied. Paste into Excel or Sheets."), ()=>toast("Couldn't copy on this device."));
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "f") return submitForm();
  if (e.target.id === "lg") {
    const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Signing in…";
    let u = $("#lgU").value.trim().toLowerCase(); const ALIAS = {riki:"riki@rikichristo.com"};
    if (ALIAS[u]) u = ALIAS[u]; else if (!u.includes("@")) u += "@drivers.rikichristo.com";
    const { error } = await sb.auth.signInWithPassword({ email:u, password:$("#lgP").value });
    if (error) return loginView(/fetch|network|load failed/i.test(error.message||"") ? "No connection. Check your signal and try again." : "That username or password didn't match.");
    resultsView();
  }
});

function route(){ if (location.hash === "#results") resultsView(); else formView(); }
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
